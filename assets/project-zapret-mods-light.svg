ize:15px;font-weight:400;animation-delay:0.26s;" class="up">Useful modifications for Zapret</text><g class="pop" style="animation-delay:0.38s"><rect x="24" y="184" width="98.2" height="28" rx="0" stroke="#9b3134" stroke-width="1" fill="none"/><text x="38.0" y="202.7" fill="#451617" text-anchor="start" style="font-size:13px;font-weight:500;">Batchfile</text></g><g class="pop" style="animation-delay:0.48s"><path d="M480-269 294-157q-8 5-17 4.5t-16-5.5q-7-5-10.5-13t-1.5-18l49-212-164-143q-8-7-9.5-15.5t.5-16.5q2-8 9-13.5t17-6.5l217-19 84-200q4-9 12-13.5t16-4.5q8 0 16 4.5t12 13.5l84 200 217 19q10 1 17 6.5t9 13.5q2 8 .5 16.5T826-544L662-401l49 212q2 10-1.5 18T699-158q-7 5-16 5.5t-17-4.5L480-269Z" fill="#a93539" transform="translate(345.2 207.0) scale(0.0198)"/><text x="388.0" y="203.0" fill="#732427" text-anchor="end" style="font-size:14px;font-weight:600;">10</text></g></svg>